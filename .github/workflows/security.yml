name: Security

on:
  push:
    branches: [main, dev, Qa]
  pull_request:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - run: pip-audit -r backend/requirements-dev.txt
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a  # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm audit --audit-level high
        working-directory: frontend

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Docker image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
            context: ./backend
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: ./frontend
          - name: proxy
            dockerfile: proxy/Dockerfile
            context: ./proxy
          - name: db
            dockerfile: database/Dockerfile
            context: ./database
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Build image
        run: docker build -f ${{ matrix.dockerfile }} -t scan-${{ matrix.name }} ${{ matrix.context }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: scan-${{ matrix.name }}
          vuln-type: os,library
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, proxy]
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker pull raisiar/proyecto-de-sistemas-${{ matrix.image }}:1.0.4
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: raisiar/proyecto-de-sistemas-${{ matrix.image }}:1.0.4
          vuln-type: os
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"