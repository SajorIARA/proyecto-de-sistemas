name: CI Principal

on:
  push:
    branches: [main, dev, Qa]
  pull_request:
    branches: [main, dev, Qa]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: turismo_melgarejo
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          DJANGO_DEBUG: 0
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_user -d turismo_melgarejo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Geo/Django system libraries
        run: sudo apt-get update && sudo apt-get install -y binutils libproj-dev gdal-bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Django checks and tests
        working-directory: backend
        env:
          POSTGRES_DB: turismo_melgarejo
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          DJANGO_DEBUG: 0
          DJANGO_SECRET_KEY: ci-dummy-secret
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: |
          python manage.py check
          python manage.py test config
      - name: Migration consistency
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-dummy-secret
        run: python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend

  docker:
    name: Docker and Compose checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          POSTGRES_DB: turismo_melgarejo
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build --pull --no-cache

  smoke:
    name: Container smoke tests
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        env:
          POSTGRES_DB: turismo_melgarejo
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          DJANGO_DEBUG: 0
        run: |
          docker compose build --pull --no-cache
          docker compose up -d --wait
      - name: Verify proxy routes
        run: |
          curl --fail --silent --show-error --output /dev/null --retry 15 --retry-all-errors --retry-delay 3 http://localhost/
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 15 --retry-all-errors --retry-delay 3 http://localhost/api/)
          test "$status" -eq 200
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v