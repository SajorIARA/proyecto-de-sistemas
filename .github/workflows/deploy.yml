name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno destino"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Railway (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # El token de Railway y el ID de proyecto deben configurarse en
      # GitHub Secrets (ver docs/plan-integr... / README).
      - name: Deploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: turismo-melgarejo-backend
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN no configurado. Deploy omitido."
            exit 0
          fi
          npx @railway/cli up --service "$RAILWAY_SERVICE" --ci

      - name: Deploy frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: turismo-melgarejo-frontend
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            exit 0
          fi
          npx @railway/cli up --service "$RAILWAY_SERVICE" --ci
