name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno destino"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
  # Solo desplegar si el CI pasó: evita publicar con tests/lint rotos.
  workflow_run:
    workflows: ["CI Principal"]
    types: [completed]
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Verificar CI en verde
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # En dispatch manual el responsable asume el estado; en automático
    # solo se despliega si el CI concluyó con éxito.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI OK, procediendo al deploy."

  deploy:
    name: Deploy to Railway (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [gate]
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      # El token de Railway y el ID de proyecto deben configurarse en
      # GitHub Secrets (ver docs/plan-integr... / README).
      - name: Deploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: turismo-melgarejo-backend
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN no configurado. Deploy no ejecutado."
            exit 1
          fi
          npx @railway/cli up --service "$RAILWAY_SERVICE" --ci

      - name: Deploy frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: turismo-melgarejo-frontend
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN no configurado. Deploy no ejecutado."
            exit 1
          fi
          npx @railway/cli up --service "$RAILWAY_SERVICE" --ci
