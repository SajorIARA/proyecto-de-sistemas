name: Docker

on:
  push:
    paths: ["Dockerfile", "**/Dockerfile", "docker-compose*.yml", "proxy/**", "backend/**", "frontend/**"]
  pull_request:
    paths: ["Dockerfile", "**/Dockerfile", "docker-compose*.yml", "proxy/**", "backend/**", "frontend/**"]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose validation (dev)
        env:
          POSTGRES_DB: turismo_melgarejo
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        run: docker compose config --quiet
      - name: Compose validation (prod)
        env:
          POSTGRES_DB: turismo_melgarejo
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          IMAGE_TAG: test
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build dev images
        run: docker compose build --pull --no-cache
      - name: Validate Nginx proxy configuration
        run: |
          docker build -t proxy-test ./proxy
          docker run --rm --add-host frontend:127.0.0.1 --add-host backend:127.0.0.1 \
            --env FRONTEND_PORT=3000 --env BACKEND_PORT=8000 proxy-test nginx -t
