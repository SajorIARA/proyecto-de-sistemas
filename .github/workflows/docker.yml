name: Docker

on:
  push:
    paths: ["Dockerfile", "**/Dockerfile", "docker-compose.yml", "proxy/**", "backend/**", "frontend/**", "database/**"]
  pull_request:
    paths: ["Dockerfile", "**/Dockerfile", "docker-compose.yml", "proxy/**", "backend/**", "frontend/**", "database/**"]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose validation
        env:
          POSTGRES_DB: turismo_melgarejo
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        run: docker compose config --quiet
      - name: Build all images
        run: docker compose build --pull --no-cache
      - name: Validate Nginx image configuration
        run: docker run --rm --env FRONTEND_PORT=80 --env BACKEND_PORT=8000 --add-host frontend:127.0.0.1 --add-host backend:127.0.0.1 raisiar/proyecto-de-sistemas-proxy:${IMAGE_TAG:-1.0.4} nginx -t
  db-backup-restore:
    name: Backup/restore roundtrip (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build db image
        run: docker build -t ci-db-test ./database
      - name: Roundtrip backup + restore
        env:
          DB_CONTAINER: ci-pg-db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: turismo_melgarejo
        run: |
          docker run -d --name ci-pg-db \
            -e POSTGRES_USER=ci_user \
            -e POSTGRES_PASSWORD=ci_password \
            -e POSTGRES_DB=turismo_melgarejo \
            ci-db-test
          for i in $(seq 1 24); do
            docker exec ci-pg-db pg_isready -U ci_user -d turismo_melgarejo && break || sleep 5
          done
          docker exec ci-pg-db psql -U ci_user -d turismo_melgarejo \
            -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE TABLE sqa_probe(id serial primary key, v text); INSERT INTO sqa_probe(v) VALUES ('ok');"
          bash database/backup.sh /tmp/sqa-probe.dump
          docker exec ci-pg-db psql -U ci_user -d turismo_melgarejo \
            -c "DROP TABLE sqa_probe;"
          bash database/restore.sh /tmp/sqa-probe.dump
          test "$(docker exec ci-pg-db psql -U ci_user -d turismo_melgarejo -tAc 'SELECT v FROM sqa_probe;')" = "ok"
      - name: Cleanup
        if: always()
        run: docker rm -f ci-pg-db || true
