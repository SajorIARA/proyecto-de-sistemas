name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: raisiar/proyecto-de-sistemas

jobs:
  images:
    name: Build & push Docker Hub images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Compute version tags
        id: meta
        run: |
          RAW="${{ github.ref_name }}"
          # quita la 'v' inicial: v1.2.3 -> 1.2.3
          VER="${RAW#v}"
          MAJOR="${VER%%.*}"
          MINOR="${VER%.*}"
          SHA="${GITHUB_SHA::12}"
          echo "semver=$VER" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build & push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.semver }}
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.minor }}
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.major }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.semver }}
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.minor }}
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.major }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.sha }}

      - name: Build & push proxy
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}-proxy:${{ steps.meta.outputs.semver }}
            ${{ env.IMAGE_PREFIX }}-proxy:${{ steps.meta.outputs.minor }}
            ${{ env.IMAGE_PREFIX }}-proxy:${{ steps.meta.outputs.major }}
            ${{ env.IMAGE_PREFIX }}-proxy:latest
            ${{ env.IMAGE_PREFIX }}-proxy:${{ steps.meta.outputs.sha }}

      - name: Build & push database image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}-db:${{ steps.meta.outputs.semver }}
            ${{ env.IMAGE_PREFIX }}-db:${{ steps.meta.outputs.minor }}
            ${{ env.IMAGE_PREFIX }}-db:${{ steps.meta.outputs.major }}
            ${{ env.IMAGE_PREFIX }}-db:latest
            ${{ env.IMAGE_PREFIX }}-db:${{ steps.meta.outputs.sha }}
