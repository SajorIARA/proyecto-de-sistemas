name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release images
        run: docker compose build --pull
      - name: Release policy
        run: echo "Image publishing and deployment are intentionally not configured yet."