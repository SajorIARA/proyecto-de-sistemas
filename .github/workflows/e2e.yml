name: E2E and smoke

on:
  workflow_dispatch:
  pull_request:
    paths: ["backend/**", "frontend/**", "proxy/**", "docker-compose.yml"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Start environment
        env:
          POSTGRES_DB: turismo_melgarejo
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          DJANGO_DEBUG: 0
        run: |
          docker compose build --pull --no-cache
          docker compose up -d --wait
      - name: Frontend through proxy
        run: curl --fail --silent --show-error --output /dev/null --retry 15 --retry-all-errors --retry-delay 3 http://localhost/
      - name: Backend through proxy
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 15 --retry-all-errors --retry-delay 3 http://localhost/api/)
          test "$status" -eq 200
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v