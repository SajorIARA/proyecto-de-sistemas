name: E2E and smoke

on:
  workflow_dispatch:
  pull_request:
    paths: ["backend/**", "frontend/**", "proxy/**", "docker-compose.yml"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start environment
        env:
          POSTGRES_DB: turismo_melgarejo
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          DJANGO_DEBUG: 0
        run: docker compose up -d --build
      - name: Frontend through proxy
        run: curl --fail --retry 15 --retry-all-errors --retry-delay 3 http://localhost/
      - name: Backend through proxy
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 15 --retry-all-errors --retry-delay 3 http://localhost/api/)
          test "$status" = "404"
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v