version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: dev
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 5
    target-branch: dev
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    target-branch: dev
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    target-branch: dev
  - package-ecosystem: docker
    directory: /proxy
    schedule:
      interval: monthly
    target-branch: dev