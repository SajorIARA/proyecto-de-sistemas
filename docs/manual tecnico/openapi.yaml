      type: object
      properties:
        id_tipo_tarifa:
          type: integer
          readOnly: true
        codigo:
          type: string
          maxLength: 30
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
          nullable: true
          maxLength: 255
      required:
      - codigo
      - id_tipo_tarifa
      - nombre
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UsuarioList:
      type: object
      properties:
        id_usuario:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        nombre:
          type: string
          readOnly: true
        activo:
          type: boolean
          readOnly: true
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolesEnum'
          readOnly: true
      required:
      - activo
      - email
      - fecha_creacion
      - id_usuario
      - nombre
      - roles
    UsuarioPreferencia:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        usuario:
          type: string
          format: uuid
        categoria:
          type: integer
        categoria_nombre:
          type: string
          readOnly: true
        nivel_interes:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        fecha_registro:
          type: string
          format: date-time
          readOnly: true
      required:
      - categoria
      - categoria_nombre
      - fecha_registro
      - id
      - usuario
    Viaje:
      type: object
      description: Representación completa de un viaje, usada en todas las respuestas.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nombre:
          type: string
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/ViajeEstadoEnum'
          readOnly: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
        iniciado_en:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finalizado_en:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        paradas:
          type: array
          items:
            $ref: '#/components/schemas/ParadaViaje'
          readOnly: true
      required:
      - actualizado_en
      - creado_en
      - estado
      - finalizado_en
      - id
      - iniciado_en
      - nombre
      - paradas
    ViajeCreate:
      type: object
      description: 'Payload de creación: ``nombre`` y paradas en el orden deseado.'
      properties:
        nombre:
          type: string
          maxLength: 150
        paradas:
          type: array
          items:
            type: string
            format: uuid
      required:
      - nombre
    ViajeEstadoEnum:
      enum:
      - planificado
      - en_curso
      - finalizado
      type: string
      description: |-
        * `planificado` - Planificado
        * `en_curso` - En curso
        * `finalizado` - Finalizado
    VisitaParada:
      type: object
      description: Cuerpo opcional de la acción de visita; por defecto marca como
        visitada.
      properties:
        visitada:
          type: boolean
          default: true
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
