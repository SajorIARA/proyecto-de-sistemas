          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/usuarios/:
    get:
      operationId: auth_usuarios_list
      description: Lista paginada de usuarios (solo ADMIN).
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsuarioListList'
          description: ''
