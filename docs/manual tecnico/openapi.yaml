      required:
      - area
      - categorias
      - descripcion
      - fecha_actualizacion
      - fecha_creacion
      - id
      - imagenes
      - nombre
      - ubicacion
    AtractivoAdmin:
      type: object
      description: |-
        Escritura de destinos turísticos (solo ADMIN).

        Acepta ``ubicacion`` como dict ``{"longitud": float, "latitud": float}``
        y lo persiste como ``Point`` SRID 4326 en PostGIS. ``categorias`` se
        escribe como lista de IDs de categoría.

        Un destino que queda publicado (``activo=True``) debe tener duración
        positiva y al menos una categoría activa; si no, el error se devuelve
        por campo (``activo``, ``categorias``, ``duracion_minutos``) para que la
        API responda 400 y el formulario pueda mostrarlo. Los borradores
        (``activo=False``) pueden guardarse incompletos.

        Compatibilidad: las fixtures históricas de admin hacen POST/PUT sin
        enviar ``activo`` ni ``categorias``. Por eso la exigencia de categoría
        se aplica cuando el payload publica o gestiona categorías (``activo`` o
        ``categorias`` presentes), y en PATCH, donde el estado final se calcula
        con el valor existente cuando ``activo`` no se envía. El formulario
        admin siempre envía ambos campos, así que el flujo real queda cubierto.
      properties:
        id_atractivo:
          type: string
          format: uuid
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
        url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        direccion:
          type: string
          nullable: true
          maxLength: 300
        duracion_minutos:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
        ubicacion:
          type: object
          properties:
            longitud:
              type: number
              minimum: -180
              maximum: 180
            latitud:
              type: number
              minimum: -90
              maximum: 90
          required:
          - longitud
          - latitud
        area:
          type: array
          items: {}
          nullable: true
          readOnly: true
        categorias:
          type: array
          items:
            type: integer
        fotos:
          type: array
          items:
            $ref: '#/components/schemas/Foto'
          readOnly: true
        fuente_origen:
          type: string
          maxLength: 100
        activo:
          type: boolean
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - area
      - descripcion
      - fecha_actualizacion
      - fecha_creacion
      - fotos
      - id_atractivo
      - nombre
      - ubicacion
    Categoria:
      type: object
      properties:
        id_categoria:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
          nullable: true
        activo:
          type: boolean
      required:
      - id_categoria
      - nombre
