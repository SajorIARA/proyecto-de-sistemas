openapi: 3.0.3
info:
  title: Turismo Melgarejo API
  version: 1.0.0
  description: API del sistema de recomendación turística de La Paz.
paths:
  /api/:
    get:
      operationId: root_retrieve
      description: Índice de módulos y documentación de la API.
      tags:
      - sistema
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Login con {email, password}. Retorna access+refresh planos y el
        usuario con sus roles.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Logout: invalida el refresh token (blacklist).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/mis-datos/:
    get:
      operationId: auth_mis_datos_retrieve
      description: Devuelve los datos personales del usuario en sesión y el historial
        que le pertenece. Nunca incluye la contraseña ni hashes.
      tags:
      - cuenta
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/mis-datos/anonimizar/:
    post:
      operationId: auth_mis_datos_anonimizar_create
      description: Anonimiza la cuenta y la da de baja. Conserva el historial sin
        datos personales; revoca los tokens pendientes.
      tags:
      - cuenta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmacionBaja'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmacionBaja'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmacionBaja'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          description: Confirmación incorrecta.
  /api/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Cambio de contraseña del usuario autenticado.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Registro público. Crea el usuario con hash PBKDF2, asigna el rol
        TOURIST y retorna tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Renovación de access con {refresh}. Retorna {access}.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/usuarios/:
    get:
      operationId: auth_usuarios_list
      description: Lista paginada de usuarios (solo ADMIN).
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsuarioListList'
          description: ''
  /api/conocimiento/admin/candidatos/{id_candidato}/aprobar/:
    post:
      operationId: conocimiento_admin_candidatos_aprobar_create
      description: Publica un candidato revisado en el catálogo y en el corpus RAG.
      parameters:
      - in: path
        name: id_candidato
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - conocimiento-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AprobarCandidato'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AprobarCandidato'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AprobarCandidato'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoAprobacion'
          description: ''
        '400':
          description: Faltan datos revisados por el admin.
        '409':
          description: El candidato ya fue rechazado.
  /api/conocimiento/admin/candidatos/{id_candidato}/rechazar/:
    post:
      operationId: conocimiento_admin_candidatos_rechazar_create
      description: Descarta un candidato sin publicarlo.
      parameters:
      - in: path
        name: id_candidato
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - conocimiento-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RechazarCandidato'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RechazarCandidato'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RechazarCandidato'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LugarCandidato'
          description: ''
        '409':
          description: El candidato ya fue aprobado.
  /api/conocimiento/admin/importaciones/:
    get:
      operationId: conocimiento_admin_importaciones_list
      description: Devuelve las últimas importaciones, más recientes primero.
      tags:
      - conocimiento-admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportacionLugares'
          description: ''
    post:
      operationId: conocimiento_admin_importaciones_create
      description: Crea la importación en estado «pendiente» y encola la consulta
        a Overpass y Wikidata en el backend. Consultar el detalle o el listado para
        seguir el progreso; los candidatos aparecen al completarse.
      tags:
      - conocimiento-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearImportacion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CrearImportacion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CrearImportacion'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportacionLugares'
          description: ''
        '400':
          description: Parámetros de búsqueda inválidos.
        '503':
          description: No se pudo encolar la importación.
  /api/conocimiento/admin/importaciones/{id_importacion}/:
    get:
      operationId: conocimiento_admin_importaciones_retrieve
      description: Detalle de una importación, incluido el estado de vectorización.
      parameters:
      - in: path
        name: id_importacion
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - conocimiento-admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportacionLugares'
          description: ''
  /api/conocimiento/admin/importaciones/{id_importacion}/candidatos/:
    get:
      operationId: conocimiento_admin_importaciones_candidatos_list
      description: Candidatos de una importación para revisión administrativa.
      parameters:
      - in: path
        name: id_importacion
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - conocimiento-admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LugarCandidato'
          description: ''
  /api/conocimiento/admin/importaciones/{id_importacion}/vectorizar/:
    post:
      operationId: conocimiento_admin_importaciones_vectorizar_create
      description: Encola embeddings solo para fuentes aprobadas. Si Ollama falla,
        el estado pasa a «error»; nunca se simula éxito RAG.
      parameters:
      - in: path
        name: id_importacion
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - conocimiento-admin
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoVectorizacion'
          description: ''
        '400':
          description: No hay candidatos aprobados aún.
  /api/conocimiento/consultar/:
    post:
      operationId: conocimiento_consultar_create
      description: Recupera fragmentos por similitud coseno y responde solo con el
        contexto encontrado. Si no hay contexto, devuelve una negativa estándar sin
        invocar al modelo.
      tags:
      - conocimiento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaRAG'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsultaRAG'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsultaRAG'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRAG'
          description: ''
        '400':
          description: Pregunta o parámetros inválidos.
        '429':
          description: Demasiadas consultas.
        '502':
          description: Ollama devolvió una respuesta inválida.
        '503':
          description: El asistente no está disponible.
  /api/conocimiento/fragmentos/:
    get:
      operationId: conocimiento_fragmentos_list
      description: CRUD fragmentos documentales. Lectura pública, escritura solo ADMIN.
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - conocimiento
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFragmentoDocumentalList'
          description: ''
    post:
      operationId: conocimiento_fragmentos_create
      description: CRUD fragmentos documentales. Lectura pública, escritura solo ADMIN.
      tags:
      - conocimiento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FragmentoDocumental'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FragmentoDocumental'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FragmentoDocumental'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FragmentoDocumental'
          description: ''
  /api/conocimiento/fragmentos/{id_fragmento}/:
    get:
      operationId: conocimiento_fragmentos_retrieve
      description: CRUD fragmentos documentales. Lectura pública, escritura solo ADMIN.
      parameters:
      - in: path
        name: id_fragmento
        schema:
          type: integer
        description: Un valor de entero único que identifique este fragmento documental.
        required: true
      tags:
      - conocimiento
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FragmentoDocumental'
          description: ''
    put:
      operationId: conocimiento_fragmentos_update
      description: CRUD fragmentos documentales. Lectura pública, escritura solo ADMIN.
      parameters:
      - in: path
        name: id_fragmento
        schema:
          type: integer
        description: Un valor de entero único que identifique este fragmento documental.
        required: true
      tags:
      - conocimiento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FragmentoDocumental'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FragmentoDocumental'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FragmentoDocumental'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FragmentoDocumental'
          description: ''
    patch:
      operationId: conocimiento_fragmentos_partial_update
      description: CRUD fragmentos documentales. Lectura pública, escritura solo ADMIN.
      parameters:
      - in: path
        name: id_fragmento
        schema:
          type: integer
        description: Un valor de entero único que identifique este fragmento documental.
        required: true
      tags:
      - conocimiento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFragmentoDocumental'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFragmentoDocumental'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFragmentoDocumental'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FragmentoDocumental'
          description: ''
    delete:
      operationId: conocimiento_fragmentos_destroy
      description: CRUD fragmentos documentales. Lectura pública, escritura solo ADMIN.
      parameters:
      - in: path
        name: id_fragmento
        schema:
          type: integer
        description: Un valor de entero único que identifique este fragmento documental.
        required: true
      tags:
      - conocimiento
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/conocimiento/fuentes/:
    get:
      operationId: conocimiento_fuentes_list
      description: CRUD fuentes documentales. Lectura pública, escritura solo ADMIN.
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - conocimiento
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFuenteDocumentalList'
          description: ''
    post:
      operationId: conocimiento_fuentes_create
      description: CRUD fuentes documentales. Lectura pública, escritura solo ADMIN.
      tags:
      - conocimiento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuenteDocumental'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FuenteDocumental'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FuenteDocumental'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuenteDocumental'
          description: ''
  /api/conocimiento/fuentes/{id_fuente}/:
    get:
      operationId: conocimiento_fuentes_retrieve
      description: CRUD fuentes documentales. Lectura pública, escritura solo ADMIN.
      parameters:
      - in: path
        name: id_fuente
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este fuente documental.
        required: true
      tags:
      - conocimiento
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuenteDocumental'
          description: ''
    put:
      operationId: conocimiento_fuentes_update
      description: CRUD fuentes documentales. Lectura pública, escritura solo ADMIN.
      parameters:
      - in: path
        name: id_fuente
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este fuente documental.
        required: true
      tags:
      - conocimiento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuenteDocumental'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FuenteDocumental'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FuenteDocumental'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuenteDocumental'
          description: ''
    patch:
      operationId: conocimiento_fuentes_partial_update
      description: CRUD fuentes documentales. Lectura pública, escritura solo ADMIN.
      parameters:
      - in: path
        name: id_fuente
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este fuente documental.
        required: true
      tags:
      - conocimiento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFuenteDocumental'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFuenteDocumental'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFuenteDocumental'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuenteDocumental'
          description: ''
    delete:
      operationId: conocimiento_fuentes_destroy
      description: CRUD fuentes documentales. Lectura pública, escritura solo ADMIN.
      parameters:
      - in: path
        name: id_fuente
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este fuente documental.
        required: true
      tags:
      - conocimiento
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/health/:
    get:
      operationId: health_retrieve
      description: Comprueba que el proceso backend está disponible.
      tags:
      - sistema
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/health/detallado/:
    get:
      operationId: health_detallado_retrieve
      description: 'Salud detallada: base de datos, alcance del servidor del asistente
        y métricas mínimas del proceso (se reinician al reiniciar).'
      tags:
      - sistema
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          description: Alguna dependencia no está disponible.
  /api/preferences/:
    get:
      operationId: preferences_list
      description: |-
        Preferencias del usuario autenticado (issue #22).

        GET lista las propias, POST crea asignando el JWT, PATCH/DELETE solo
        sobre las propias. Nunca expone ni acepta otro usuario.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: PK.
        required: true
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - preferences
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMiPreferenciaList'
          description: ''
    post:
      operationId: preferences_create
      description: |-
        Preferencias del usuario autenticado (issue #22).

        GET lista las propias, POST crea asignando el JWT, PATCH/DELETE solo
        sobre las propias. Nunca expone ni acepta otro usuario.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: PK.
        required: true
      tags:
      - preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiPreferencia'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MiPreferencia'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MiPreferencia'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiPreferencia'
          description: ''
  /api/preferences/{id}/:
    get:
      operationId: preferences_retrieve
      description: |-
        Preferencias del usuario autenticado (issue #22).

        GET lista las propias, POST crea asignando el JWT, PATCH/DELETE solo
        sobre las propias. Nunca expone ni acepta otro usuario.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: PK.
        required: true
      tags:
      - preferences
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiPreferencia'
          description: ''
    patch:
      operationId: preferences_partial_update
      description: |-
        Preferencias del usuario autenticado (issue #22).

        GET lista las propias, POST crea asignando el JWT, PATCH/DELETE solo
        sobre las propias. Nunca expone ni acepta otro usuario.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: PK.
        required: true
      tags:
      - preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMiPreferencia'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMiPreferencia'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMiPreferencia'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
