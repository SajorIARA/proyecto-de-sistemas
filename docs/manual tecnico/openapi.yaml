      - new_password_confirm
    PatchedAtractivoAdmin:
      type: object
      description: |-
        Escritura de destinos turísticos (solo ADMIN).

        Acepta ``ubicacion`` como dict ``{"longitud": float, "latitud": float}``
        y lo persiste como ``Point`` SRID 4326 en PostGIS. ``categorias`` se
        escribe como lista de IDs de categoría.
      properties:
        id_atractivo:
          type: string
          format: uuid
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
        url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        direccion:
          type: string
          nullable: true
          maxLength: 300
        duracion_minutos:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
        ubicacion:
          type: object
          properties:
            longitud:
              type: number
              minimum: -180
              maximum: 180
            latitud:
              type: number
              minimum: -90
              maximum: 90
          required:
          - longitud
          - latitud
        area:
          type: array
          items: {}
          nullable: true
          readOnly: true
        categorias:
          type: array
          items:
            type: integer
        fotos:
          type: array
          items:
            $ref: '#/components/schemas/Foto'
          readOnly: true
        fuente_origen:
          type: string
          maxLength: 100
        activo:
          type: boolean
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
    PatchedCategoria:
      type: object
      properties:
        id_categoria:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
          nullable: true
        activo:
          type: boolean
    PatchedConsultaRecomendacion:
      type: object
      properties:
        id_consulta:
          type: string
          format: uuid
          readOnly: true
        usuario:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        presupuesto_bob:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        tiempo_horas:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        punto_partida:
          type: object
          properties:
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
          required:
          - coordinates
          example:
            coordinates:
            - -68.1486
            - -16.4966
        macrodistrito:
          type: string
          nullable: true
          maxLength: 80
        fecha_consulta:
          type: string
          format: date-time
          readOnly: true
    PatchedFoto:
      type: object
      description: |-
        Foto/video de un destino.

        Es el serializer de escritura de ``FotoAdminViewSet`` y, a la vez, el
        serializer anidado de solo lectura que ``AtractivoAdminSerializer``
        expone en ``fotos``. ``tipo`` y ``estado`` son escribibles para que el
        flujo de subida directa (firma → Cloudinary → POST del registro) pueda
        nacer en ``completed``; las subidas pesadas por Celery los reciben del
        default del modelo.
      properties:
        id_foto:
          type: integer
          readOnly: true
        atractivo:
          type: string
          format: uuid
        public_id:
          type: string
          maxLength: 300
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        tipo:
          $ref: '#/components/schemas/FotoTipoEnum'
        estado:
          $ref: '#/components/schemas/EstadoEnum'
        ancho:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        alto:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        orden:
          type: integer
          maximum: 2147483647
          minimum: 0
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
