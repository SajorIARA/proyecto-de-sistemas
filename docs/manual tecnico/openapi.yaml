    RecomendacionRequest:
      type: object
      description: |-
        Perfil de entrada del motor de recomendación (issue #27).

        ``preferencias`` es opcional: si se omite, la vista usa las
        preferencias persistidas del usuario autenticado. El mapa permite
        probar perfiles alternativos sin alterar su perfil guardado:
        ``{"Cultura": 0.9, "Naturaleza": 0.5}``.
      properties:
        presupuesto_bob:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        tiempo_horas:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        punto_partida:
          type: object
          properties:
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
          required:
          - coordinates
          example:
            coordinates:
            - -68.1486
            - -16.4966
        radio_km:
          type: number
          format: double
          maximum: 50.0
          minimum: 0.1
          default: 15.0
        top_k:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
        preferencias:
          type: object
          additionalProperties:
            type: string
            format: decimal
            pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        macrodistrito:
          type: string
          nullable: true
          maxLength: 80
      required:
      - presupuesto_bob
      - punto_partida
      - tiempo_horas
