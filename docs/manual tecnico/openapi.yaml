          type: string
          format: uuid
          readOnly: true
          nullable: true
        presupuesto_bob:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        tiempo_horas:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        punto_partida:
          type: object
          properties:
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
          required:
          - coordinates
          example:
            coordinates:
            - -68.1486
            - -16.4966
