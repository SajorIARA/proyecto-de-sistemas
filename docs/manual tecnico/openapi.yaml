components:
  schemas:
    Atractivo:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
        url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        direccion:
          type: string
          nullable: true
          maxLength: 300
        duracion_minutos:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
        ubicacion:
          type: object
          additionalProperties:
            type: number
            format: double
          readOnly: true
        area:
          type: array
          items: {}
          nullable: true
          readOnly: true
        categorias:
          type: array
          items:
            type: string
          readOnly: true
        imagenes:
          type: array
          items:
            type: string
          description: |-
            Solo fotos terminadas y de tipo imagen.

            El frontend arma una URL de Cloudinary con cada ``public_id``; si se
            incluyeran videos o subidas pendientes/fallidas, el catálogo mostraría
            imágenes rotas.
          readOnly: true
        fuente_origen:
          type: string
          maxLength: 100
        activo:
          type: boolean
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - area
      - categorias
      - descripcion
      - fecha_actualizacion
      - fecha_creacion
      - id
      - imagenes
      - nombre
      - ubicacion
    AtractivoAdmin:
      type: object
      description: |-
        Escritura de destinos turísticos (solo ADMIN).

        Acepta ``ubicacion`` como dict ``{"longitud": float, "latitud": float}``
        y lo persiste como ``Point`` SRID 4326 en PostGIS. ``categorias`` se
        escribe como lista de IDs de categoría.
      properties:
        id_atractivo:
          type: string
          format: uuid
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
        url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        direccion:
          type: string
          nullable: true
          maxLength: 300
        duracion_minutos:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
        ubicacion:
          type: object
          properties:
            longitud:
              type: number
              minimum: -180
              maximum: 180
            latitud:
              type: number
              minimum: -90
              maximum: 90
          required:
          - longitud
          - latitud
        area:
          type: array
          items: {}
          nullable: true
          readOnly: true
        categorias:
          type: array
          items:
            type: integer
        fotos:
          type: array
          items:
            $ref: '#/components/schemas/Foto'
          readOnly: true
        fuente_origen:
          type: string
          maxLength: 100
        activo:
          type: boolean
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - area
      - descripcion
      - fecha_actualizacion
      - fecha_creacion
      - fotos
      - id_atractivo
      - nombre
      - ubicacion
    Categoria:
      type: object
      properties:
        id_categoria:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
          nullable: true
        activo:
          type: boolean
      required:
      - id_categoria
      - nombre
    ConsultaRecomendacion:
      type: object
      properties:
        id_consulta:
          type: string
          format: uuid
          readOnly: true
        usuario:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        presupuesto_bob:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        tiempo_horas:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        punto_partida:
          type: object
          properties:
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
          required:
          - coordinates
          example:
            coordinates:
            - -68.1486
            - -16.4966
        macrodistrito:
          type: string
          nullable: true
          maxLength: 80
        fecha_consulta:
          type: string
          format: date-time
          readOnly: true
      required:
      - fecha_consulta
      - id_consulta
      - presupuesto_bob
      - punto_partida
      - tiempo_horas
      - usuario
    EstadoEnum:
      enum:
      - pending
      - processing
      - completed
      - failed
      type: string
      description: |-
        * `pending` - Pendiente
        * `processing` - Procesando
        * `completed` - Completada
        * `failed` - Fallida
    EstadoScrapingEnum:
      enum:
      - pendiente
      - completado
      - error
      type: string
      description: |-
        * `pendiente` - Pendiente
        * `completado` - Completado
        * `error` - Error
    FirmaFoto:
      type: object
      description: |-
        Cuerpo documentado de POST /admin/fotos/firma/ (drf-spectacular).

        Solo alimenta el esquema OpenAPI: la vista valida a mano porque el
        flujo es una firma de Cloudinary con respuestas propias (400/503).
        Debe mantenerse en paralelo con las validaciones de FirmaFotoView.post.
      properties:
        atractivo:
          type: string
          format: uuid
        formato:
          $ref: '#/components/schemas/FormatoEnum'
        bytes:
          type: integer
          maximum: 10485760
          minimum: 1
      required:
      - atractivo
      - bytes
      - formato
    FormatoEnum:
      enum:
      - jpg
      - jpeg
      - png
      - webp
      type: string
      description: |-
        * `jpg` - jpg
        * `jpeg` - jpeg
        * `png` - png
        * `webp` - webp
    Foto:
      type: object
      description: |-
        Foto/video de un destino.

        Es el serializer de escritura de ``FotoAdminViewSet`` y, a la vez, el
        serializer anidado de solo lectura que ``AtractivoAdminSerializer``
        expone en ``fotos``. ``tipo`` y ``estado`` son escribibles para que el
        flujo de subida directa (firma → Cloudinary → POST del registro) pueda
        nacer en ``completed``; las subidas pesadas por Celery los reciben del
        default del modelo.
      properties:
        id_foto:
          type: integer
          readOnly: true
        atractivo:
          type: string
          format: uuid
        public_id:
          type: string
          maxLength: 300
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        tipo:
          $ref: '#/components/schemas/FotoTipoEnum'
        estado:
          $ref: '#/components/schemas/EstadoEnum'
        ancho:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        alto:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        orden:
          type: integer
          maximum: 2147483647
          minimum: 0
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - atractivo
      - fecha_creacion
      - id_foto
      - public_id
    FotoTipoEnum:
      enum:
      - imagen
      - video
      type: string
      description: |-
        * `imagen` - Imagen
        * `video` - Video
    FragmentoDocumental:
      type: object
      properties:
        id_fragmento:
          type: integer
          readOnly: true
        fuente:
          type: string
          format: uuid
        fuente_titulo:
          type: string
          readOnly: true
        numero_fragmento:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        contenido:
          type: string
        embedding:
          type: array
          items:
            type: number
            format: double
          writeOnly: true
          nullable: true
          maxItems: 768
          minItems: 768
        embedding_modelo:
          type: string
          readOnly: true
        embedding_dimension:
          type: integer
          readOnly: true
          nullable: true
        embedding_actualizado:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - contenido
      - embedding_actualizado
      - embedding_dimension
      - embedding_modelo
      - fecha_creacion
      - fuente
      - fuente_titulo
      - id_fragmento
      - numero_fragmento
    FuenteDocumental:
      type: object
      properties:
        id_fuente:
          type: string
          format: uuid
          readOnly: true
        atractivo:
          type: string
          format: uuid
          nullable: true
        titulo:
          type: string
          maxLength: 250
        url:
          type: string
          nullable: true
        tipo:
          type: string
          nullable: true
          maxLength: 50
        fecha_actualizacion:
          type: string
          format: date-time
          nullable: true
        hash_contenido:
          type: string
          readOnly: true
        estado_scraping:
          allOf:
          - $ref: '#/components/schemas/EstadoScrapingEnum'
          readOnly: true
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - estado_scraping
      - fecha_creacion
      - hash_contenido
      - id_fuente
      - titulo
    Horario:
      type: object
      properties:
        id_horario:
          type: integer
          readOnly: true
        atractivo:
          type: string
          format: uuid
        dia_semana:
          type: integer
          maximum: 7
          minimum: 1
        hora_apertura:
          type: string
          format: time
          nullable: true
        hora_cierre:
          type: string
          format: time
          nullable: true
        cerrado:
          type: boolean
        vigente_desde:
          type: string
          format: date
          nullable: true
        vigente_hasta:
          type: string
          format: date
          nullable: true
      required:
      - atractivo
      - dia_semana
      - id_horario
    Logout:
      type: object
      description: 'Body de logout: el refresh a invalidar.'
      properties:
        refresh:
          type: string
      required:
      - refresh
    MiPreferencia:
      type: object
      description: |-
        Preferencias del usuario autenticado (issue #22).

        El usuario se asigna desde el JWT y no es escribible: cada turista
        gestiona solo sus propias preferencias y restricciones.
      properties:
        id:
          type: integer
          readOnly: true
        usuario:
          type: string
          format: uuid
          readOnly: true
        categoria:
          type: integer
        categoria_nombre:
          type: string
          readOnly: true
        nivel_interes:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        fecha_registro:
          type: string
          format: date-time
          readOnly: true
      required:
      - categoria
      - categoria_nombre
      - fecha_registro
      - id
      - usuario
    PaginatedAtractivoAdminList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
