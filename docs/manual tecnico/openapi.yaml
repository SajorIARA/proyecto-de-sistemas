  /api/viajes/{id}/finalizar/:
    post:
      operationId: viajes_finalizar
      description: Marca el viaje como `finalizado`. Llamadas repetidas son inofensivas.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: UUID del viaje.
        required: true
      tags:
      - viajes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
          description: ''
  /api/viajes/{id}/iniciar/:
    post:
      operationId: viajes_iniciar
      description: Marca el viaje como `en_curso`. Llamadas repetidas son inofensivas.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: UUID del viaje.
        required: true
      tags:
      - viajes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
          description: ''
  /api/viajes/{id}/paradas/{parada_id}/visitada/:
    post:
      operationId: viajes_marcar_visitada
      description: Marca (o desmarca) una parada del viaje y devuelve el viaje completo.
        `visitada` defaults a `true` cuando se omite el cuerpo.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: UUID del viaje.
        required: true
      - in: path
        name: parada_id
        schema:
          type: integer
        description: ID de la parada.
        required: true
      tags:
      - viajes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitaParada'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitaParada'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitaParada'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
          description: ''
        '404':
          description: Parada inexistente.
components:
