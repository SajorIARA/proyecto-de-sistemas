# Cabeceras de seguridad compartidas.
#
# Se incluyen en el bloque `server` y DENTRO de `location /assets/`:
# nginx no hereda los `add_header` del nivel superior cuando el bloque hijo
# declara alguno propio (p. ej. Cache-Control), así que sin este include los
# bundles /assets/*.js se servían con 200 y sin CSP, HSTS ni X-Frame-Options.
#
# CSP: permite los hosts que el SPA usa de verdad (ver frontend/src):
#   - res.cloudinary.com / images.unsplash.com  -> <img> de catálogo
#   - *.tile.openstreetmap.org                 -> teselas Leaflet
#   - api.cloudinary.com                       -> subida directa (connect-src)
#   - blob:                                    -> previsualizaciones con
#                                                 URL.createObjectURL
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://images.unsplash.com https://*.tile.openstreetmap.org; connect-src 'self' https://api.cloudinary.com https://res.cloudinary.com; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
