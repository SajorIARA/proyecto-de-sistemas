server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Headers de seguridad (compartidos con /assets/: nginx no los hereda
    # si el bloque hijo declara algún add_header propio)
    include /etc/nginx/security-headers.conf;

    # Asset con hash -> cache largo
    location /assets/ {
        # Re-incluimos las cabeceras: sin esto, /assets/*.js respondía 200
        # sin CSP, HSTS, X-Frame-Options ni Referrer-Policy.
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta no resuelta vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
