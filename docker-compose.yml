services:
  db:
    image: postgres:17-alpine
    container_name: turismo-melgarejo_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: raisiar/proyecto-de-sistemas-backend:${IMAGE_TAG:-1.0.4}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: turismo-melgarejo_backend
    restart: always
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
      - datos-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    image: raisiar/proyecto-de-sistemas-frontend:${IMAGE_TAG:-1.0.4}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: turismo-melgarejo_frontend
    restart: always
    command: ./node_modules/.bin/vite --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app-network
      - turismo-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  proxy:
    image: raisiar/proyecto-de-sistemas-proxy:${IMAGE_TAG:-1.0.4}
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: turismo-melgarejo_proxy
    restart: always
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - turismo-network
      - app-network

networks:
  turismo-network:
    driver: bridge
  app-network:
    driver: bridge
  datos-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  frontend_node_modules:
    driver: local