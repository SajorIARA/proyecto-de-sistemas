services:
  db:
    # Imagen propia con PostGIS + pgvector: el schema (extensiones, tablas)
    # lo crean las migraciones de Django en el primer arranque del backend.
    build:
      context: ./database
      dockerfile: Dockerfile
    image: raisiar/proyecto-de-sistemas-db:${IMAGE_TAG:-latest}
    container_name: turismo-melgarejo_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: raisiar/proyecto-de-sistemas-backend:${IMAGE_TAG:-1.0.8}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: turismo-melgarejo_backend
    restart: always
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ci-placeholder}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
      - datos-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    image: raisiar/proyecto-de-sistemas-frontend:${IMAGE_TAG:-1.0.7}
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: turismo-melgarejo_frontend
    restart: always
    command: pnpm dev --host 0.0.0.0 --port 3000
    networks:
      - app-network
      - turismo-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  proxy:
    image: raisiar/proyecto-de-sistemas-proxy:${IMAGE_TAG:-1.0.4}
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: turismo-melgarejo_proxy
    restart: always
    ports:
      - "80:80"
    environment:
      FRONTEND_PORT: 3000
      BACKEND_PORT: 8000
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - turismo-network
      - app-network

  redis:
    image: redis:7-alpine
    container_name: turismo-melgarejo_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    image: raisiar/proyecto-de-sistemas-backend:${IMAGE_TAG:-1.0.8}
    container_name: turismo-melgarejo_worker
    restart: always
    # Solo el backend migra (evita carreras de CREATE EXTENSION entre
    # migradores concurrentes); el worker espera a que esté healthy.
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ci-placeholder}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network
      - datos-network

  beat:
    image: raisiar/proyecto-de-sistemas-backend:${IMAGE_TAG:-1.0.8}
    container_name: turismo-melgarejo_beat
    restart: always
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ci-placeholder}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network
      - datos-network

  flower:
    image: raisiar/proyecto-de-sistemas-backend:${IMAGE_TAG:-1.0.8}
    container_name: turismo-melgarejo_flower
    restart: always
    command: celery -A config flower --address=0.0.0.0 --port=5555 --persistent=True --db=/tmp/flower.db
    volumes:
      - ./backend:/app
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ci-placeholder}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5555), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  turismo-network:
    driver: bridge
  app-network:
    driver: bridge
  datos-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local