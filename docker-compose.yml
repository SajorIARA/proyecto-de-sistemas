services:
  db:
    image: postgres:17-alpine
    container_name: turismo-melgarejo_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: turismo-melgarejo_backend
    restart: always
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      - db
    networks:
      - app-network
      - datos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: turismo-melgarejo_frontend
    restart: always
    command: pnpm run dev --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app-network
      - turismo-network

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: turismo-melgarejo_proxy
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - turismo-network
      - app-network

networks:
  turismo-network:
    driver: bridge
  app-network:
    driver: bridge
  datos-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  frontend_node_modules:
    driver: local